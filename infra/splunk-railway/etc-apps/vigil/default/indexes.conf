# The index VIGIL's log generator writes to and the ingestor polls.
#
# RETENTION CAPS keep the Railway volume from filling up. Without them Splunk's
# indexes (especially _internal, which it writes to constantly) grow unbounded
# and eventually trip minFreeSpace, which is why the volume kept needing bumps.
# maxTotalDataSizeMB rolls the oldest buckets out (deleted, no archive) once an
# index exceeds the cap; frozenTimePeriodInSecs ages data out by time. Together
# the whole var/ footprint stays ~1 GB regardless of how long it runs.
#
# NOTE: Splunk .conf files do NOT support inline comments — a comment after a
# value makes the value unparseable. Keep every comment on its own line.

[vigil_test]
homePath   = $SPLUNK_DB/vigil_test/db
coldPath   = $SPLUNK_DB/vigil_test/colddb
thawedPath = $SPLUNK_DB/vigil_test/thaweddb
maxTotalDataSizeMB = 400
# 3 days
frozenTimePeriodInSecs = 259200

# ── Cap Splunk's built-in indexes (attrs merge over the system defaults) ──────
# _internal is the usual culprit — Splunk logs metrics.log every 30s here.
[_internal]
maxTotalDataSizeMB = 250
# 2 days
frozenTimePeriodInSecs = 172800

[_introspection]
maxTotalDataSizeMB = 80
# 1 day
frozenTimePeriodInSecs = 86400

[_telemetry]
maxTotalDataSizeMB = 50
frozenTimePeriodInSecs = 172800

[_metrics]
maxTotalDataSizeMB = 80
frozenTimePeriodInSecs = 172800

[_metrics_rollup]
maxTotalDataSizeMB = 50

[_audit]
maxTotalDataSizeMB = 80

[_configtracker]
maxTotalDataSizeMB = 30

[_thefishbucket]
maxTotalDataSizeMB = 100

[history]
maxTotalDataSizeMB = 20

[main]
maxTotalDataSizeMB = 100
frozenTimePeriodInSecs = 259200

[summary]
maxTotalDataSizeMB = 20
